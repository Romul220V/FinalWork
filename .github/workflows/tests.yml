name: UI Tests & Allure Report

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Скачка кода из репозитория
        uses: actions/checkout@v4

      - name: Устанавливка Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Выдача прав на запуск gradlew
        run: chmod +x gradlew

      - name: Запуск автотестов в фоновом режиме
        run: ./gradlew clean test -Dselenide.browser=chrome -Dselenide.headless=true

      - name: Подтягивание истории прошлых запусков из ветки gh-pages
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-history

      - name: Перенос истории в результаты тестов
        if: always()
        run: |
          mkdir -p build/allure-results/history
          cp -r gh-pages-history/history/* build/allure-results/history/ 2>/dev/null || true

      - name: Генерирация готового HTML-отчёт Allure через Gradle
        if: always()
        run: ./gradlew allureReport

      - name: Публикация отчёта на GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: build/reports/allure-report/allureReport
